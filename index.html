<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAILY FIND</title>
<!-- OG -->
<link rel="alternate" type="application/rss+xml" title="DAILY FIND" href="/feed.xml">
<link rel="apple-touch-icon" href="icons/site-180.png">
<link rel="icon" type="image/png" href="icons/site-180.png">
<meta name="apple-mobile-web-app-title" content="DAILY FIND">
<!-- 【安全対策】このページが読み込んでよい相手を限定する -->
<!--    グループ機能のため Firebase（gstatic / googleapis）、曲検索（Apple / Deezer）、管理者の Google ログインを許可 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://api.deezer.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://itunes.apple.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src 'self' https://dailyfind-friends.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261123b">
<link rel="stylesheet" href="friends.css?v=20261123b">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="meta"><span id="issue">—</span><span>A DAILY SELECTION OF GOOD THINGS</span><span id="today">—</span></div>
    <button type="button" class="mhelp" id="introOpen2" aria-label="DAILY FIND の使い方">？</button>
    <h1><a href="#">DAILY FIND</a></h1>
    <p class="sub">毎日ひとつ、いいものを見つける。</p>
    <div class="double-rule"></div>
  </header>

  <nav class="mainnav" id="mainnav" aria-label="メニュー">
    <button data-go=""><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></button>
    <button data-go="all"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span>見つける</span></button>
    <button data-go="group"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.8 3.1-6 6.5-6s5.9 2.2 6.5 6"/><circle cx="17" cy="9.5" r="2.6"/><path d="M16.5 14.2c2.7.2 4.4 2 5 5"/></svg><span>グループ</span></button>
    <button data-go="activity"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.4-4.5-9.4-8.9C1.1 8.4 3 4.6 6.7 4.6c2.2 0 3.9 1.3 5.3 3.1 1.4-1.8 3.1-3.1 5.3-3.1 3.7 0 5.6 3.8 4.1 7-2 4.4-9.4 8.9-9.4 8.9z"/></svg><span>お知らせ</span><span class="nbadge" id="actBadge" hidden></span></button>
    <button data-go="me"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.5 4-7 8-7s7.2 2.5 8 7"/></svg><span>マイページ</span></button>
    <button data-go="admin" id="navAdmin" hidden><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19.5 6v5.5c0 4.6-3.2 7.7-7.5 9-4.3-1.3-7.5-4.4-7.5-9V6z"/></svg><span>管理<span class="badge" id="navBadge" hidden></span></span></button>
    <button type="button" class="navhelp" id="introOpen" aria-label="DAILY FIND の使い方">？使い方</button>
  </nav>

  <!-- はじめて開いた人向けの説明（5ステップ） -->
  <div class="intro" id="intro" hidden role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="intro-card">
      <button type="button" class="intro-skip" id="introSkip">スキップ</button>
      <div class="intro-slides" id="introSlides"></div>
      <div class="intro-dots" id="introDots"></div>
      <div class="intro-actions"><button type="button" class="btn ghost" id="introBack">戻る</button><button type="button" class="btn" id="introNext">次へ</button></div>
    </div>
  </div>

  <!-- ホーム画面に追加する方法（スマホで、まだ追加していないときだけ上に出る） -->
  <div class="a2hs" id="a2hs" hidden>
    <div class="a2hs-top">
      <span>📱 ホーム画面に追加すると、アプリのようにすぐ開けます</span>
      <span class="a2hs-btns"><button type="button" id="a2hsOpen">やり方を見る</button><button type="button" id="a2hsClose" aria-label="閉じる">×</button></span>
    </div>
    <div class="a2hs-body" id="a2hsBody" hidden></div>
  </div>

  <main id="app"></main>
  <section id="fapp" hidden></section>

  <footer><span>© <span id="year"></span> DAILY FIND</span><span><a href="#" id="introLink" style="text-decoration:none">❓ DAILY FIND とは</a><a href="#feedback" style="text-decoration:none">💬 意見を送る</a><a href="#" id="a2hsLink" style="text-decoration:none">📱 ホーム画面に追加する方法</a><span id="total"></span><a href="#admin" style="text-decoration:none;color:var(--muted)">管理者</a></span></footer>
</div>

<script src="common.js?v=20261123b"></script>
<script>
  let picks = [];
  let filter = "ALL";

  const no = p => "No." + String(picks.length - picks.indexOf(p)).padStart(3, "0");

  function feature(p) {
    return `
      <article class="feature">
        ${cover(p, "", true)}
        <div>
          <div class="kicker">${cat(p.category).en} / ${esc(p.category)}<span class="no">${no(p)} · ${fmtDate(p.date)}</span></div>
          <h2>${esc(p.title)}</h2>
          ${p.by ? `<div class="by">${esc(p.by)}</div>` : ""}
          ${stars(p.rating || 0)}
          ${p.oneline ? `<p class="pull">${esc(p.oneline)}</p>` : ""}
          <div class="body">${paras(p.body)}</div>
          ${p.category === "音楽" ? listenHtml(p, true)
            : safeLink(p.link) ? `<a class="more" href="${esc(safeLink(p.link))}" target="_blank" rel="noopener noreferrer">${esc(ctaLabel(p))} ↗</a>` : ""}
          ${share(p)}
        </div>
      </article>`;
  }

  // ===== プレイリスト =====
  // 「ALL SONGS」（音楽の記事ぜんぶ）＋ 書く画面で付けたプレイリスト名ごと
  function playlists() {
    const songs = picks.filter(p => p.category === "音楽");
    const lists = songs.length ? [{ key: "all", name: "ALL SONGS", tracks: songs }] : [];
    const byName = new Map();
    for (const p of picks) {
      const n = String(p.playlist || "").trim();
      if (!n) continue;
      if (!byName.has(n)) byName.set(n, []);
      byName.get(n).push(p);
    }
    for (const [n, tracks] of byName) lists.push({ key: n, name: n, tracks });
    return lists;
  }
  const plHash = l => "#pl:" + encodeURIComponent(l.key);

  function playlistCards(lists) {
    return `<div class="grid">${lists.map(l => `
      <a class="item" href="${esc(plHash(l))}">
        ${cover(l.tracks[0])}
        <div class="kicker">PLAYLIST<span class="no">${l.tracks.length}曲</span></div>
        <h4>${esc(l.name)}</h4>
        <p>${esc(l.tracks.slice(0, 3).map(t => t.title).join(" / "))}${l.tracks.length > 3 ? " …" : ""}</p>
      </a>`).join("")}</div>`;
  }

  function playlistView(l) {
    const mins = l.tracks.length;
    return `
      <a class="back" href="#">← BACK TO TOP</a>
      <section class="playlist">
        <div class="pl-head">
          ${cover(l.tracks[0])}
          <div>
            <div class="kicker">PLAYLIST</div>
            <h2>${esc(l.name)}</h2>
            <div class="by">${mins}曲 · DAILY FIND</div>
          </div>
        </div>
        <ol class="tracklist">${l.tracks.map((p, i) => `
          <li>
            <span class="tno">${String(i + 1).padStart(2, "0")}</span>
            <a class="tmain" href="#${esc(p.id)}">
              ${cover(p)}
              <span class="tt"><b>${esc(p.title)}</b><small>${esc(p.by || "")}</small></span>
            </a>
            ${stars(p.rating || 0)}
            ${p.category === "音楽" ? listenHtml(p, false) : safeLink(p.link) ? `<a class="tlisten" href="${esc(safeLink(p.link))}" target="_blank" rel="noopener noreferrer">見る ↗</a>` : `<span></span>`}
          </li>`).join("")}
        </ol>
      </section>`;
  }

  // シェアボタン（X / LINE / リンクをコピー）
  // 記事ごとのページ（p/〇〇.html）を共有すると、X や LINE でジャケット付きのカードになる
  function share(p) {
    const url = location.origin + "/p/" + encodeURIComponent(p.id) + ".html";
    const text = `DAILY FIND：${p.title}${p.oneline ? "｜" + p.oneline : ""}`;
    const u = encodeURIComponent(url), t = encodeURIComponent(text);
    return `
      <div class="share">
        <span class="lbl">SHARE</span>
        <a href="https://twitter.com/intent/tweet?text=${t}&url=${u}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.6 8.7L23 22h-6.8l-5.3-6.9L4.8 22H1.7l8.1-9.3L1 2h7l4.8 6.3L18.9 2Zm-1.2 18h1.9L7.4 3.9H5.4L17.7 20Z"/></svg>X</a>
        <a href="https://social-plugins.line.me/lineit/share?url=${u}" target="_blank" rel="noopener">LINE</a>
        <button type="button" data-copy="${esc(url)}">リンクをコピー</button>
      </div>`;
  }

  function bindShare(root) {
    root.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "コピーしました ✓"; }
      catch { prompt("このリンクをコピーしてください", b.dataset.copy); }
      setTimeout(() => b.textContent = "リンクをコピー", 2000);
    });
  }

  // 検索・並び替え
  let query = "", sortBy = "new";
  const SORTS = {
    new:  (a, b) => b.date.localeCompare(a.date),
    old:  (a, b) => a.date.localeCompare(b.date),
    star: (a, b) => (b.rating || 0) - (a.rating || 0) || b.date.localeCompare(a.date),
  };
  function updateGrid(past) {
    const q = query.trim().toLowerCase();
    if (filter === "PLAYLISTS") { document.getElementById("gridArea").innerHTML = playlistCards(playlists()); return; }
    let list = (q || filter !== "ALL") ? picks : past;   // 検索・絞り込み中は今日の分も含める
    if (filter !== "ALL") list = list.filter(p => p.category === filter);
    if (q) list = list.filter(p => [p.title, p.by, p.playlist, p.oneline, p.body, p.category, cat(p.category).en]
      .join(" ").toLowerCase().includes(q));
    list = [...list].sort(SORTS[sortBy]);
    document.getElementById("gridArea").innerHTML = (q && !list.length)
      ? `<p class="empty">「${esc(query)}」に当てはまるおすすめは見つかりませんでした。</p>` : grid(list);
  }

  function grid(list) {
    if (!list.length) return `<p class="empty">まだこのカテゴリのおすすめはありません。</p>`;
    return `<div class="grid">${list.map(p => `
      <a class="item" href="#${esc(p.id)}">
        ${cover(p)}
        <div class="kicker">${cat(p.category).en}<span class="no">${no(p)}</span></div>
        <h4>${esc(p.title)}</h4>
        ${stars(p.rating || 0)}
        <p>${esc(p.oneline)}</p>
      </a>`).join("")}</div>`;
  }

  function render() {
    const app = document.getElementById("app");
    if (!picks.length) { app.innerHTML = `<p class="empty" style="padding:40px 0">まだおすすめがありません。もうすぐ最初の1つが届きます。</p>`; return; }

    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash.startsWith("pl:")) {
      const l = playlists().find(x => x.key === hash.slice(3));
      if (l) { app.innerHTML = playlistView(l); window.scrollTo(0, 0); return; }
    }
    const single = picks.find(p => p.id === hash);
    if (single) {
      app.innerHTML = `<a class="back" href="#">← BACK TO TOP</a>` + feature(single);
      bindShare(app);
      window.scrollTo(0, 0);
      return;
    }

    const [latest, ...past] = picks;
    // プレイリストは「これまでのおすすめ」の中の PLAYLISTS タブで見る（トップをすっきりさせるため）
    const cats = ["ALL", ...new Set(picks.map(p => p.category)), ...(playlists().length ? ["PLAYLISTS"] : [])];
    app.innerHTML = `<div id="homeNews"></div><div class="section-head" style="border-top:0;padding-top:24px;margin-bottom:0"><h3>Today's Pick<small>今日のおすすめ</small></h3></div>`
      + feature(latest) + `<div id="homeExtras"></div>` + (past.length || playlists().length ? `
      <section>
        <div class="section-head">
          <h3>Back Issues<small>これまでのおすすめ</small></h3>
          <div class="tabs">${cats.map(c => `<button data-c="${esc(c)}" class="${c === filter ? "on" : ""}">${c === "ALL" || c === "PLAYLISTS" ? c : cat(c).en}</button>`).join("")}</div>
        </div>
        <div class="tools">
          <input type="search" id="q" placeholder="キーワードで探す（タイトル・作者・紹介文）" value="${esc(query)}" aria-label="検索">
          <select id="sort" aria-label="並び替え">
            <option value="new">新しい順</option>
            <option value="old">古い順</option>
            <option value="star">評価が高い順</option>
          </select>
        </div>
        <div id="gridArea"></div>
      </section>` : "");
    bindShare(app);
    window.dispatchEvent(new Event("df:home"));   // グループの新着・みんなのプレイリストを入れる
    if (!app.querySelector("#sort")) return;
    app.querySelector("#sort").value = sortBy;
    app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      filter = b.dataset.c;
      app.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
      updateGrid(past);
    });
    app.querySelector("#q").oninput = e => { query = e.target.value; updateGrid(past); };
    app.querySelector("#sort").onchange = e => { sortBy = e.target.value; updateGrid(past); };
    updateGrid(past);
  }

  (async () => {
    picks = await loadPicks();
    const now = new Date();
    const iso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    document.getElementById("today").textContent = `${fmtDate(iso)} ${weekday(iso)}`;
    document.getElementById("issue").textContent = `ISSUE ${String(picks.length).padStart(3, "0")}`;
    document.getElementById("total").textContent = `${picks.length} PICKS`;
    document.getElementById("year").textContent = now.getFullYear();
    window.addEventListener("hashchange", route);
    route();
  })();

  // ===== 画面の切り替え（ホーム / 見つける / グループ / マイページ / 管理） =====
  const FRIENDS_VIEW = h => /^(g=|u=|group$|all$|me$|activity$|admin$|feedback$)/.test(h);
  const navOf = h => h.startsWith("g=") ? "group" : h.startsWith("u=") ? "all" : (FRIENDS_VIEW(h) ? h : "");
  let adminOn = false;
  function setNav(v) {
    // 「管理」は、管理者としてログイン中か、管理画面を開いているときだけ出す
    document.getElementById("navAdmin").hidden = !(adminOn || v === "admin");
    document.querySelectorAll("#mainnav button").forEach(b => b.classList.toggle("on", b.dataset.go === v));
    // 選んだメニューが画面の外にはみ出していたら、見えるところまで横にずらす
    requestAnimationFrame(() => {
      const nav = document.getElementById("mainnav"), on = nav.querySelector(".on");
      if (!on) return;
      const left = on.offsetLeft - nav.offsetLeft, right = left + on.offsetWidth;
      if (right > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = right - nav.clientWidth + 8;
      else if (left < nav.scrollLeft) nav.scrollLeft = left;
    });
  }
  // 画面を切り替えたら、新しい画面の先頭を見せる（下のほうでリンクを押しても、途中から始まらないように）
  function scrollToView(friends) {
    if (!friends) { window.scrollTo(0, 0); return; }
    const nav = document.getElementById("mainnav"), navTop = getComputedStyle(nav).position === "sticky" ? nav.offsetHeight : 0;
    const y = document.getElementById("fapp").getBoundingClientRect().top + window.scrollY - navTop;
    window.scrollTo(0, Math.max(0, y));
  }
  let lastView = null;
  function route() {
    const h = location.hash.slice(1);
    const friends = FRIENDS_VIEW(h);
    document.getElementById("app").hidden = friends;
    document.getElementById("fapp").hidden = !friends;
    setNav(navOf(h));
    if (lastView !== null && lastView !== h && (friends || !h)) requestAnimationFrame(() => scrollToView(friends));
    lastView = h;
    if (friends) {
      window.dispatchEvent(new Event("df:leavehome"));
      if (window.DF_READY) window.dispatchEvent(new CustomEvent("df:view", { detail: h }));
      else document.getElementById("fapp").innerHTML = `<p class="empty">読み込んでいます…</p>`;
    } else {
      render();
    }
  }
  document.querySelectorAll("#mainnav button").forEach(b => b.onclick = () => {
    const target = b.dataset.go ? "#" + b.dataset.go : "#";
    if (location.hash === target || (!b.dataset.go && !location.hash)) { route(); scrollToView(!!b.dataset.go); }
    else location.hash = target;
  });
  // ===== はじめての人への説明 =====
  (() => {
    const slides = [
      { icon: "👋", title: "DAILY FIND へようこそ", text: "<b>毎日ひとつ、いいもの</b>を紹介するサイトです。音楽・本・映画・お店など、管理者が選んだおすすめを毎日1つ届けます。<br>ホームの「<b>Today's Pick</b>」が今日のおすすめです。" },
      { icon: "🔍", title: "あなたのおすすめもシェア", text: "好きな曲や本を投稿できます。「<b>公開</b>」で投稿すると、誰でも「<b>見つける</b>」で見られます。<br>気になる人を<b>フォロー</b>すると、その人の投稿が「フォロー中」にまとまります。" },
      { icon: "👥", title: "仲間だけのグループ", text: "仲のいい友達だけで見せ合いたいときは「<b>グループ</b>」へ。招待リンクを LINE で送るだけで友達が参加でき、投稿は<b>メンバーにしか見えません</b>。" },
      { icon: "🙂", title: "マイページ", text: "「<b>マイページ</b>」で、ニックネーム・<b>写真のアイコン</b>・自己紹介を決められます。自分の投稿、フォロー中、フォロワーもここで見られます。<br>メールアドレスもパスワードも要りません。" },
      { icon: "📱", title: "ホーム画面に追加しよう", text: "ホーム画面に追加すると、アプリのようにワンタップで開けます。やり方は、いちばん下の「📱 ホーム画面に追加する方法」で見られます。<br>気づいたことは「<b>💬 意見を送る</b>」からいつでもどうぞ。" },
    ];
    let i = 0;
    const el = document.getElementById("intro");
    const draw = () => {
      const s = slides[i];
      document.getElementById("introSlides").innerHTML = `<div class="intro-icon">${s.icon}</div><h2 id="introTitle">${s.title}</h2><p>${s.text}</p>`;
      document.getElementById("introDots").innerHTML = slides.map((_, k) => `<span class="${k === i ? "on" : ""}"></span>`).join("");
      document.getElementById("introBack").style.visibility = i ? "visible" : "hidden";
      document.getElementById("introNext").textContent = i === slides.length - 1 ? "はじめる" : "次へ";
    };
    const open = () => { i = 0; draw(); el.hidden = false; document.getElementById("introNext").focus(); };
    const close = () => { el.hidden = true; try { localStorage.setItem("df_intro_seen", "1"); } catch {} };
    document.getElementById("introNext").onclick = () => { if (i < slides.length - 1) { i++; draw(); } else close(); };
    document.getElementById("introBack").onclick = () => { if (i > 0) { i--; draw(); } };
    document.getElementById("introSkip").onclick = close;
    el.addEventListener("click", e => { if (e.target === el) close(); });
    document.addEventListener("keydown", e => { if (!el.hidden && e.key === "Escape") close(); });
    document.getElementById("introOpen").onclick = open;
    document.getElementById("introOpen2").onclick = open;
    document.getElementById("introLink").onclick = e => { e.preventDefault(); open(); };
    let seen = false; try { seen = localStorage.getItem("df_intro_seen") === "1"; } catch {}
    if (!seen) open();
  })();

  // ===== ホーム画面に追加する方法 =====
  (() => {
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(ua);
    const inLINE = / Line\//i.test(ua);
    const inApp = inLINE || /Instagram|FBAN|FBAV|Twitter/i.test(ua);
    const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
    const share = `<svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:-3px" aria-label="共有ボタン"><path fill="currentColor" d="M12 2 7.5 6.5l1.4 1.4L11 5.8V15h2V5.8l2.1 2.1 1.4-1.4zM5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10h-3v2h1v8H7v-8h1v-2z"/></svg>`;
    const iosSteps = `<b>iPhone（Safari）</b><ol>
      <li>画面の下（iPad は上）にある <span class="key">${share} 共有</span> ボタンを押す</li>
      <li>メニューを下にスクロールして「<b>ホーム画面に追加</b>」を押す</li>
      <li>右上の「<b>追加</b>」を押す → ホーム画面に黒い「DF」のアイコンができます</li></ol>`;
    const androidSteps = `<b>Android（Chrome）</b><ol>
      <li>右上の <span class="key">︙</span> を押す</li>
      <li>「<b>ホーム画面に追加</b>」または「<b>アプリをインストール</b>」を押す</li>
      <li>「追加」を押す → ホーム画面に「DF」のアイコンができます</li></ol>`;
    const lineNote = inApp ? `<p class="a2hs-warn">⚠️ 今は${inLINE ? " LINE " : "アプリ"}の中で開いています。このままではホーム画面に追加できません。<br>
      右下（または右上）のメニュー「︙」から「<b>ブラウザで開く</b>」を押して、${isAndroid ? "Chrome" : "Safari"} で開き直してください。</p>` : "";
    const body = `${lineNote}${isIOS ? iosSteps : isAndroid ? androidSteps : iosSteps + androidSteps}
      <p class="a2hs-tip">💡 追加したら、<b>これからはホーム画面のアイコンから</b>開いてください。${isAndroid ? "ブラウザ" : "Safari"} とホーム画面のアイコンでは、マイページやグループが別々になります。<br>グループの招待リンクは、<b>押さずに長押しでコピー</b>して、アイコンから開いた DAILY FIND の「グループ」→「🔗 招待で参加」に貼り付けると、アイコンの方で参加できます。<br>マイページを <b>Google とつないでおけば</b>、アイコンから開いたあと「マイページ」→「Google でログイン」で、Safari で使っていたマイページ・グループにそのまま戻れます。</p>`;
    const box = document.getElementById("a2hs"), bodyEl = document.getElementById("a2hsBody");
    bodyEl.innerHTML = body;
    let closed = false; try { closed = localStorage.getItem("df_a2hs_closed") === "1"; } catch {}
    if ((isIOS || isAndroid) && !standalone && !closed) box.hidden = false;
    document.getElementById("a2hsOpen").onclick = () => { bodyEl.hidden = !bodyEl.hidden; };
    document.getElementById("a2hsClose").onclick = () => { box.hidden = true; try { localStorage.setItem("df_a2hs_closed", "1"); } catch {} };
    document.getElementById("a2hsLink").onclick = e => { e.preventDefault(); box.hidden = false; bodyEl.hidden = false; box.scrollIntoView({ behavior: "smooth", block: "start" }); };
  })();

  // ===== 新しい版が出ていたら自動で読み直す =====
  // ホーム画面に追加したアイコン（特に iPhone）は、前に開いた画面を覚えたままになりやすい。
  // 開いたときと、アプリに戻ってきたときに、公開中の版の番号を確かめて、違えば読み直す。
  const APP_VERSION = "20261123b";   // 公開するたびに ?v= と一緒に上げる
  async function checkUpdate() {
    try {
      const html = await (await fetch("/?vcheck=" + Date.now(), { cache: "no-store" })).text();
      const latest = (html.match(/APP_VERSION = "(\w+)"/) || [])[1];
      if (!latest || latest === APP_VERSION) return;
      let tried = ""; try { tried = sessionStorage.getItem("df_reload_for") || ""; } catch {}
      if (tried === latest) return;   // 同じ版のための読み直しは1回だけ（ぐるぐる回らないように）
      try { sessionStorage.setItem("df_reload_for", latest); } catch {}
      location.replace(location.pathname + "?u=" + latest + location.hash);
    } catch {}
  }
  checkUpdate();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });

  window.DF = {
    setNav,
    setAdmin: on => { adminOn = on; setNav(navOf(location.hash.slice(1))); },
    setBadge: n => { const b = document.getElementById("navBadge"); b.hidden = !n; },
    // お知らせ（いいね・フォロー）の未読の数。インスタのように赤い丸に数字を出す
    setActBadge: n => { const b = document.getElementById("actBadge"); b.hidden = !n; b.textContent = n > 9 ? "9+" : String(n || ""); },
    friendsReady: () => { if (FRIENDS_VIEW(location.hash.slice(1))) route(); else if (picks.length && document.getElementById("homeExtras")) window.dispatchEvent(new Event("df:home")); },
  };
</script>
<script type="module" src="friends.js?v=20261123b"></script>
</body>
