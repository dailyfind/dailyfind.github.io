<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DAILY FIND FRIENDS</title>
<!-- 【安全対策】読み込み・通信してよい相手を限定する（Firebase・Apple・Deezer・フォントだけ） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://api.deezer.com; connect-src 'self' https://*.googleapis.com https://itunes.apple.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/friends-180.png">
<link rel="icon" type="image/png" href="../icons/friends-180.png">
<meta name="apple-mobile-web-app-title" content="DF FRIENDS">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  [hidden] { display: none !important; }
  .fhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 18px 0 10px; border-bottom: 3px solid var(--rule); flex-wrap: wrap; }
  .fhead h1 { font-family: var(--display); font-weight: 800; letter-spacing: -.03em; font-size: 26px; margin: 0; line-height: 1; }
  .fhead h1 a { text-decoration: none; }
  .fhead h1 span { color: var(--accent); }
  .fnav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fnav select { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--hair); border-radius: 99px; padding: 5px 10px; max-width: 180px; }
  .screen { padding: 22px 0 60px; }
  .panel { background: var(--card); border-radius: 12px; padding: 20px; display: grid; gap: 14px; max-width: 560px; }
  .panel h2 { margin: 0; font-size: 20px; }
  .panel p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
  label, .lbl { display: grid; gap: 6px; font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
  input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--hair); border-radius: 8px; padding: 11px 12px; width: 100%; letter-spacing: normal; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .04em; padding: 12px 24px; border-radius: 99px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); text-decoration: none; display: inline-block; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--hair); }
  .btn.small { padding: 6px 14px; font-size: 12px; font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .msg { font-size: 13px; } .msg.ok { color: #2f7a45; } .msg.err { color: var(--accent); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .invite { display: flex; gap: 8px; } .invite input { font-size: 13px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; letter-spacing: normal; color: var(--ink); }
  .check input { width: auto; margin-top: 3px; }

  /* アイコン */
  .av { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; line-height: 1; flex: none; color: #fff; }
  .av.big { width: 52px; height: 52px; font-size: 28px; }
  .picker { display: grid; gap: 10px; }
  .emojis, .colors { display: flex; flex-wrap: wrap; gap: 6px; }
  .emojis button { font-size: 22px; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--hair); background: var(--paper); cursor: pointer; }
  .colors button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .emojis button.on { border: 2px solid var(--ink); } .colors button.on { border-color: var(--ink); }

  /* グループの見出し */
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .bar h2 { margin: 0; font-family: var(--serif); font-size: 24px; }
  .members { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; background: var(--card); border-radius: 99px; padding: 3px 10px 3px 3px; color: var(--muted); }
  .chip .av { width: 22px; height: 22px; font-size: 12px; }
  .tabs2 { display: flex; gap: 18px; border-bottom: 1px solid var(--hair); margin-bottom: 18px; }
  .tabs2 button { background: none; border: 0; padding: 8px 0; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs2 button.on { color: var(--ink); border-color: var(--ink); font-weight: 700; }

  /* 投稿フォーム */
  .compose { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 24px; display: grid; gap: 12px; }
  .rate { display: flex; gap: 4px; }
  .rate button { background: none; border: 0; font-size: 30px; line-height: 1; cursor: pointer; color: var(--hair); padding: 2px 3px; touch-action: manipulation; }
  .rate button.on { color: var(--star); }
  .picked { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
  .picked .cover { aspect-ratio: 1; border-radius: 4px; }
  .picked .cover-en { font-size: 12px; } .picked .cover-ja { display: none; }
  .suggest { background: var(--paper); border: 1px solid var(--ink); border-radius: 8px; max-height: 360px; overflow-y: auto; }
  .s-item { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--hair); }
  .s-item:hover { background: var(--card); }
  .s-item img, .s-item .cover { width: 48px; height: 48px; object-fit: cover; border-radius: 3px; }
  .s-item .cover-en { font-size: 10px; } .s-item .cover-ja { display: none; }
  .s-t { font-weight: 700; font-size: 15px; line-height: 1.4; } .s-a { font-size: 12px; color: var(--muted); }
  .s-msg { padding: 12px; font-size: 13px; color: var(--muted); }

  /* タイムライン */
  .post { display: grid; grid-template-columns: 92px 1fr; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--hair); }
  .post .cover { aspect-ratio: 1; border-radius: 4px; }
  .post .cover-en { font-size: 15px; } .post .cover-ja { display: none; }
  .post .who { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .post .who b { color: var(--ink); font-weight: 700; }
  .post .kick { font-size: 11px; letter-spacing: .18em; color: var(--accent); font-weight: 700; margin-top: 6px; }
  .post h3 { margin: 2px 0 0; font-size: 18px; line-height: 1.4; }
  .post .by { color: var(--muted); font-size: 13px; }
  .post .stars { font-size: 13px; display: block; margin: 4px 0; }
  .post p { margin: 6px 0 0; }
  .ops { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .ops .txt { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .ops .txt.armed { color: var(--accent); font-weight: 700; }
  .listen { font-size: 12px; font-weight: 700; text-decoration: none; border: 1px solid var(--hair); border-radius: 99px; padding: 3px 12px; }
  .like { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid var(--hair); border-radius: 99px; padding: 3px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); touch-action: manipulation; }
  .like .h { color: var(--hair); font-size: 15px; }
  .like.on { border-color: var(--accent); } .like.on .h { color: var(--accent); }
  .likers { font-size: 12px; color: var(--muted); width: 100%; }
  .pub { font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); padding: 30px 0; }

  /* プレイリスト */
  .tracklist .tr { display: grid; grid-template-columns: 26px 52px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair); }
  .tracklist .no { font-family: var(--display); font-weight: 700; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .tracklist .cover { aspect-ratio: 1; border-radius: 3px; }
  .tracklist .cover-en { font-size: 10px; } .tracklist .cover-ja { display: none; }
  .tracklist .tt { min-width: 0; }
  .tracklist .tt b { display: block; font-size: 15px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tracklist .tt small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tracklist .end { display: flex; gap: 8px; align-items: center; }
  .tracklist .cnt { font-size: 12px; color: var(--accent); white-space: nowrap; }
  .pl-top { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .pl-top h2 { margin: 0; font-family: var(--display); font-weight: 800; letter-spacing: -.02em; font-size: 26px; }
  .pl-top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .seg { display: flex; gap: 6px; }
  details.manage { margin-top: 40px; font-size: 14px; }
  details.manage summary { cursor: pointer; color: var(--muted); }
  details.manage .panel { margin-top: 12px; }
  .mrow { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--hair); gap: 8px; }
  .mrow span { display: flex; gap: 8px; align-items: center; }
  @media (max-width: 560px) {
    .row2 { grid-template-columns: 1fr; }
    .post { grid-template-columns: 70px 1fr; gap: 12px; }
    .tracklist .tr { grid-template-columns: 22px 44px 1fr auto; gap: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="fhead">
    <h1><a href="../">DAILY FIND</a> <span>FRIENDS</span></h1>
    <div class="fnav">
      <button class="btn small ghost" id="allBtn">みんなのプレイリスト</button>
      <select id="groupSelect" aria-label="グループを選ぶ"></select>
    </div>
  </header>

  <main class="screen" id="screen"><p class="empty">読み込んでいます…</p></main>

  <footer><span>DAILY FIND FRIENDS</span><span>メールもパスワードも使いません</span></footer>
</div>

<script src="../common.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, orderBy, limit,
           onSnapshot, serverTimestamp, writeBatch, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Firebase の接続情報（公開してよい情報。データの守りは Firestore のルールで行う）
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-FxC1jCePfY8FNsXPHv72lKuQ-0OdO5E",
    authDomain: "dailyfind-friends.firebaseapp.com",
    projectId: "dailyfind-friends",
    storageBucket: "dailyfind-friends.firebasestorage.app",
    messagingSenderId: "765801083878",
    appId: "1:765801083878:web:db4eec9e1531309f4adc27",
  };

  // ほかのサイトに埋め込まれていたら画面を出さない
  if (window.top !== window.self) { document.documentElement.innerHTML = ""; throw new Error("framed"); }

  const app = initializeApp(FIREBASE_CONFIG);
  // 匿名ログインだけ使うので、ポップアップ用の部品は読み込まない
  const auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence] });
  const db = getFirestore(app);
  const $ = id => document.getElementById(id);
  const screen = $("screen");

  // ===== アイコン（顔写真は使わず、絵文字と色だけ） =====
  const EMOJIS = ["🎧", "🎸", "🎹", "🎤", "🥁", "🎷", "📚", "🎬", "☕", "🌙", "🌈", "🐱", "🐶", "🦊", "🐼", "🍙", "🌸", "⚡"];
  const COLORS = ["#8a3a2c", "#2c3a48", "#4a5240", "#463e5c", "#2c4644", "#47292f", "#b07a2a", "#3b3936"];
  const pickOne = a => a[crypto.getRandomValues(new Uint32Array(1))[0] % a.length];
  const av = (icon, color, big) => `<span class="av${big ? " big" : ""}" style="background:${COLORS.includes(color) ? color : COLORS[7]}">${esc(icon || "🎧")}</span>`;
  function pickerHtml(id, cur) {
    return `<div class="picker" id="${id}">
      <div class="emojis">${EMOJIS.map(e => `<button type="button" data-e="${e}" class="${e === cur.icon ? "on" : ""}" aria-label="アイコン ${e}">${e}</button>`).join("")}</div>
      <div class="colors">${COLORS.map(c => `<button type="button" data-c="${c}" class="${c === cur.color ? "on" : ""}" style="background:${c}" aria-label="色"></button>`).join("")}</div>
    </div>`;
  }
  function bindPicker(id, cur, onChange) {
    const root = $(id);
    root.onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.e) cur.icon = b.dataset.e;
      if (b.dataset.c) cur.color = b.dataset.c;
      root.querySelectorAll("[data-e]").forEach(x => x.classList.toggle("on", x.dataset.e === cur.icon));
      root.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x.dataset.c === cur.color));
      onChange && onChange(cur);
    };
  }

  // ===== この端末に覚えておくグループ =====
  const LS_KEY = "dff_groups";
  const loadGroups = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } };
  const saveGroups = gs => { try { localStorage.setItem(LS_KEY, JSON.stringify(gs)); } catch {} };
  const rememberGroup = (gid, key, name) => { const gs = loadGroups().filter(g => g.gid !== gid); gs.unshift({ gid, key, name: name || "" }); saveGroups(gs); };
  const forgetGroup = gid => saveGroups(loadGroups().filter(g => g.gid !== gid));
  const lastGid = () => { try { return localStorage.getItem("dff_last") || ""; } catch { return ""; } };
  const setLast = gid => { try { localStorage.setItem("dff_last", gid); } catch {} };

  const inviteUrl = (gid, key) => `${location.origin}${location.pathname}#g=${encodeURIComponent(gid)}&k=${encodeURIComponent(key)}`;
  function randomKey(n = 28) {
    const abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
    return [...crypto.getRandomValues(new Uint32Array(n))].map(x => abc[x % abc.length]).join("");
  }
  const fmtTime = ts => { if (!ts || !ts.toDate) return ""; const d = ts.toDate();
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  const songId = (gid, pid) => `${gid}_${pid}`;
  const isPublicSong = p => p && p.category === "音楽" && p.public === true;
  function setMsg(id, t, ok) { const el = $(id); if (el) { el.textContent = t; el.className = "msg " + (ok ? "ok" : "err"); } }
  function fatal(t) { screen.innerHTML = `<p class="empty">${esc(t)}</p>`; }

  let me = null;
  let current = null;       // { gid, key, name, owner, nickname, icon, color }
  let unsubs = [];
  const stopListening = () => { unsubs.forEach(u => u()); unsubs = []; };

  // ===== はじめ =====
  onAuthStateChanged(auth, async user => {
    if (!user) { try { await signInAnonymously(auth); } catch { fatal("つながりませんでした。通信状況を確認して、ページを開き直してください。"); } return; }
    me = user.uid;
    route();
  });
  window.addEventListener("hashchange", route);
  $("allBtn").onclick = () => { stopListening(); current = null; drawGroupSelect(); publicScreen(); };

  async function route() {
    if (!me) return;
    stopListening();
    const h = new URLSearchParams(location.hash.slice(1));
    const gid = h.get("g"), key = h.get("k");
    if (gid && key) {
      rememberGroup(gid, key);
      history.replaceState(null, "", location.pathname);   // アドレス欄から合言葉を消す
      return openGroup(gid, key);
    }
    if (h.has("all")) return publicScreen();
    const gs = loadGroups();
    const pick = gs.find(g => g.gid === lastGid()) || gs[0];
    if (pick) return openGroup(pick.gid, pick.key);
    welcome();
  }

  function drawGroupSelect() {
    const gs = loadGroups();
    $("groupSelect").innerHTML = (current ? "" : `<option value="" selected>グループを選ぶ</option>`)
      + gs.map(g => `<option value="${esc(g.gid)}" ${current && g.gid === current.gid ? "selected" : ""}>${esc(g.name || "（参加前のグループ）")}</option>`).join("")
      + `<option value="__new">＋ グループを作る</option>`;
  }
  $("groupSelect").onchange = e => {
    const v = e.target.value; stopListening();
    if (v === "__new") { current = null; return welcome(true); }
    const g = loadGroups().find(x => x.gid === v); if (g) openGroup(g.gid, g.key);
  };

  // ===== グループを作る =====
  function welcome(fromMenu) {
    current = null; drawGroupSelect();
    const prof = { icon: pickOne(EMOJIS), color: pickOne(COLORS) };
    screen.innerHTML = `
      <div class="panel">
        <h2>友達と「いいもの」をシェアしよう</h2>
        <p>グループは誰でも作れます。招待リンクを送ると、友達はニックネームだけで参加できます。メールアドレスもパスワードも要りません。</p>
        ${fromMenu ? "" : `<p>招待リンクをもらった人は、そのリンクを開いてください。</p>`}
        <label>グループの名前<input id="gName" maxlength="30" placeholder="例：いつもの4人"></label>
        <label>あなたのニックネーム<input id="gNick" maxlength="20" placeholder="例：こうへい"></label>
        <div class="lbl">あなたのアイコン ${pickerHtml("gPick", prof)}</div>
        <div class="actions"><button class="btn" id="gCreate">グループを作る</button><span class="msg" id="gMsg"></span></div>
        <p class="note">保存されるのは、グループ名・ニックネーム・アイコン・投稿だけです。名前やメールアドレスなどの個人情報は保存しません。</p>
      </div>
      <p style="margin-top:20px"><button class="btn ghost" id="toAll">みんなのプレイリストを見る</button></p>`;
    bindPicker("gPick", prof);
    $("toAll").onclick = () => publicScreen();
    $("gCreate").onclick = async () => {
      const name = $("gName").value.trim(), nickname = $("gNick").value.trim();
      if (!name || !nickname) return setMsg("gMsg", "グループの名前とニックネームを入れてください。", false);
      $("gCreate").disabled = true; setMsg("gMsg", "作っています…", true);
      try {
        const key = randomKey();
        const gref = doc(collection(db, "groups"));
        const b = writeBatch(db);
        b.set(gref, { name, owner: me, createdAt: serverTimestamp() });
        b.set(doc(db, "groups", gref.id, "private", "invite"), { key });
        await b.commit();
        await setDoc(doc(db, "groups", gref.id, "members", me), { nickname, icon: prof.icon, color: prof.color, key, joinedAt: serverTimestamp() });
        rememberGroup(gref.id, key, name);
        openGroup(gref.id, key, true);
      } catch (e) { console.error(e); setMsg("gMsg", "作れませんでした。少し待ってからもう一度押してください。", false); $("gCreate").disabled = false; }
    };
  }

  // ===== グループを開く =====
  async function openGroup(gid, key, justCreated) {
    setLast(gid);
    let member = null;
    try { const m = await getDoc(doc(db, "groups", gid, "members", me)); member = m.exists() ? m.data() : null; } catch {}
    if (!member) return joinScreen(gid, key);
    let g = null, inv = null;
    try { g = (await getDoc(doc(db, "groups", gid))).data(); inv = (await getDoc(doc(db, "groups", gid, "private", "invite"))).data(); } catch {}
    if (!g || !inv) { forgetGroup(gid); return fatal("このグループは見つかりませんでした。閉じられたか、外された可能性があります。"); }
    current = { gid, key: inv.key, name: g.name, owner: g.owner, nickname: member.nickname, icon: member.icon, color: member.color };
    rememberGroup(gid, inv.key, g.name);
    drawGroupSelect();
    groupScreen(justCreated);
  }

  // ===== 参加画面 =====
  function joinScreen(gid, key) {
    current = null; drawGroupSelect();
    const prof = { icon: pickOne(EMOJIS), color: pickOne(COLORS) };
    screen.innerHTML = `
      <div class="panel">
        <h2>グループに招待されています</h2>
        <p>ニックネームとアイコンを選ぶだけで参加できます。メールアドレスもパスワードも要りません。</p>
        <label>あなたのニックネーム<input id="jNick" maxlength="20" placeholder="例：みさき" autocomplete="nickname"></label>
        <div class="lbl">あなたのアイコン ${pickerHtml("jPick", prof)}</div>
        <div class="actions"><button class="btn" id="jGo">参加する</button><span class="msg" id="jMsg"></span></div>
        <p class="note">保存されるのは、ニックネーム・アイコン・あなたの投稿だけです。</p>
      </div>`;
    bindPicker("jPick", prof);
    $("jGo").onclick = async () => {
      const nickname = $("jNick").value.trim();
      if (!nickname) return setMsg("jMsg", "ニックネームを入れてください。", false);
      $("jGo").disabled = true; setMsg("jMsg", "参加しています…", true);
      try {
        await setDoc(doc(db, "groups", gid, "members", me), { nickname, icon: prof.icon, color: prof.color, key, joinedAt: serverTimestamp() });
        openGroup(gid, key);
      } catch (e) {
        console.error(e); forgetGroup(gid);
        setMsg("jMsg", "参加できませんでした。招待リンクが古いか、まちがっている可能性があります。", false); $("jGo").disabled = false;
      }
    };
  }

  // ===== グループ画面 =====

  function groupScreen(justCreated) {

    const prof = { icon: current.icon, color: current.color };
    screen.innerHTML = `
      <div class="bar">
        <div><h2>${esc(current.name)}</h2></div>
        <div class="actions">
          <button class="btn small ghost" id="inviteBtn">友達を招待</button>

      </div>
      <div class="members" id="members"></div>
      <div class="panel" id="invitePanel" ${justCreated ? "" : "hidden"} style="margin-bottom:20px">
        <h2>招待リンク</h2>

        <div class="invite"><input id="invUrl" readonly value="${esc(inviteUrl(current.gid, current.key))}"><button class="btn small" id="copyInv">コピー</button></div>
        <div class="actions"><a class="btn small ghost" href="https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(inviteUrl(current.gid, current.key))}" target="_blank" rel="noopener">LINE で送る</a><span class="msg" id="invMsg"></span></div>
      </div>
      <section class="compose" id="compose" hidden></section>

      <div id="body"><p class="empty">読み込んでいます…</p></div>
      <details class="manage">
        <summary>設定（ニックネーム・アイコン・グループを抜ける${isOwner ? "・メンバー管理" : ""}）</summary>
        <div class="panel">
          <label>ニックネーム<input id="nickEdit" maxlength="20" value="${esc(current.nickname)}"></label>
          <div class="lbl">アイコン ${pickerHtml("ePick", prof)}</div>

          ${isOwner ? `

            <div class="actions"><button class="btn small ghost" id="rotate">招待リンクを作り直す</button><span class="msg" id="rotMsg"></span></div>` : ""}
          <div class="actions" style="margin-top:10px"><button class="btn small ghost" id="leave">このグループを抜ける</button></div>
        </div>
      </details>`;
    bindPicker("ePick", prof);
    screen.querySelectorAll(".tabs2 button").forEach(b => { b.classList.toggle("on", b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; screen.querySelectorAll(".tabs2 button").forEach(x => x.classList.toggle("on", x === b)); drawBody(); }; });
    $("inviteBtn").onclick = () => { $("invitePanel").hidden = !$("invitePanel").hidden; };
    $("copyInv").onclick = async () => {
      try { await navigator.clipboard.writeText($("invUrl").value); setMsg("invMsg", "コピーしました", true); }
      catch { $("invUrl").select(); setMsg("invMsg", "選択しました。長押しでコピーしてください", true); }
    };
    $("newBtn").onclick = () => openCompose(null);
    $("nickSave").onclick = async () => {
      const n = $("nickEdit").value.trim(); if (!n) return;
      try {
        await updateDoc(doc(db, "groups", current.gid, "members", me), { nickname: n, icon: prof.icon, color: prof.color });
        Object.assign(current, { nickname: n, icon: prof.icon, color: prof.color });
        setMsg("nickMsg", "変更しました（これからの投稿に使われます）", true);
      } catch { setMsg("nickMsg", "変更できませんでした", false); }
    };
    $("leave").onclick = async e => {
      const b = e.target;
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "本当に抜ける？（もう一度押す）"; return; }
      try { await deleteDoc(doc(db, "groups", current.gid, "members", me)); } catch {}
      forgetGroup(current.gid); stopListening(); current = null; route();
    };
    if (isOwner) {
      $("rotate").onclick = async () => {
        const key = randomKey();
        try {
          await updateDoc(doc(db, "groups", current.gid, "private", "invite"), { key });
          current.key = key; rememberGroup(current.gid, key, current.name);
          $("invUrl").value = inviteUrl(current.gid, key); $("invitePanel").hidden = false;
          setMsg("rotMsg", "作り直しました。新しい招待リンクを送ってください。", true);
        } catch (e) { console.error(e); setMsg("rotMsg", "作り直せませんでした", false); }
      };
    }

    unsubs.push(onSnapshot(collection(db, "groups", current.gid, "members"), snap => {
      members = {};
      snap.forEach(d => { members[d.id] = d.data(); });
      $("members").innerHTML = Object.entries(members).map(([uid, m]) => `<span class="chip">${av(m.icon, m.color)}${esc(m.nickname)}${uid === me ? "（あなた）" : ""}</span>`).join("");
      if (isOwner && $("mlist")) {
        $("mlist").innerHTML = Object.entries(members).map(([uid, m]) => `<div class="mrow"><span>${av(m.icon, m.color)}${esc(m.nickname)}${uid === me ? "（あなた）" : ""}</span>${uid === me ? "" : `<button class="btn small ghost" data-kick="${esc(uid)}">外す</button>`}</div>`).join("");
        $("mlist").querySelectorAll("[data-kick]").forEach(b => b.onclick = () => deleteDoc(doc(db, "groups", current.gid, "members", b.dataset.kick)).catch(() => {}));
      }
      drawBody();
    }, () => {}));

    unsubs.push(onSnapshot(query(collection(db, "groups", current.gid, "posts"), orderBy("createdAt", "desc"), limit(200)), snap => {
      posts = []; snap.forEach(d => posts.push({ id: d.id, ...d.data() }));
      drawBody();
    }, err => { console.error(err); $("body").innerHTML = `<p class="empty">読み込めませんでした。グループから外された可能性があります。</p>`; }));
  }

  const likeCount = p => Object.keys(p.likes || {}).length;
  const likedByMe = p => !!(p.likes && p.likes[me]);
  const likersText = p => Object.keys(p.likes || {}).map(u => (members[u] && members[u].nickname) || "抜けた人").join("、");
  const likeBtn = p => `<button class="like ${likedByMe(p) ? "on" : ""}" data-like="${esc(p.id)}" aria-pressed="${likedByMe(p)}"><span class="h">♥</span>${likeCount(p) || ""}</button>`;

  function drawBody() {
    const body = $("body"); if (!body || !current) return;
    if (tab === "pl") return drawGroupPlaylist(body);
    const isOwner = current.owner === me;
    body.innerHTML = posts.length ? posts.map(p => {
      const mine = p.uid === me, link = safeLink(p.link);
      return `
        <article class="post">
          ${cover({ title: p.title, category: p.category, image: p.image })}
          <div>
            <div class="who">${av(p.icon, p.color)}<b>${esc(p.nickname)}</b>${fmtTime(p.createdAt)}</div>
            <div class="kick">${esc(cat(p.category).en)}</div>
            <h3>${esc(p.title)}</h3>
            ${p.by ? `<div class="by">${esc(p.by)}</div>` : ""}
            ${stars(p.rating)}
            ${p.oneline ? `<p>${esc(p.oneline)}</p>` : ""}
            <div class="ops">
              ${likeBtn(p)}
              ${link ? `<a class="listen" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(ctaLabel(p))} ↗</a>` : ""}
              ${mine ? `<button class="txt" data-edit="${esc(p.id)}">編集</button>` : ""}
              ${mine || isOwner ? `<button class="txt" data-del="${esc(p.id)}">削除</button>` : ""}
              ${likeCount(p) ? `<div class="likers">♥ ${esc(likersText(p))}</div>` : ""}
              ${isPublicSong(p) ? `<div class="pub">🌐 曲名だけ「みんなのプレイリスト」に載っています</div>` : ""}
            </div>
          </div>
        </article>`;
    }).join("") : `<p class="empty">まだ投稿がありません。「＋ 投稿する」から、最初の1つをシェアしましょう。</p>`;
    bindPostButtons(body);
  }

  function drawGroupPlaylist(body) {
    const songs = posts.filter(p => p.category === "音楽").sort((a, b) => likeCount(b) - likeCount(a) || ((b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
    body.innerHTML = `
      <div class="pl-top"><div><h2>${esc(current.name)}</h2><p>グループのプレイリスト · ${songs.length}曲 · いいねが多い順</p></div></div>
      <div class="tracklist">${songs.length ? songs.map((p, i) => `
        <div class="tr">
          <span class="no">${String(i + 1).padStart(2, "0")}</span>
          ${cover({ title: p.title, category: "音楽", image: p.image })}
          <div class="tt"><b>${esc(p.title)}</b><small>${esc(p.by || "")} · ${esc(p.nickname)}</small></div>
          <div class="end">${likeBtn(p)}${safeLink(p.link) ? `<a class="listen" href="${esc(safeLink(p.link))}" target="_blank" rel="noopener noreferrer">聴く ↗</a>` : ""}</div>
        </div>`).join("") : `<p class="empty">まだ曲がありません。</p>`}</div>`;
    bindPostButtons(body);
  }

  function bindPostButtons(root) {
    root.querySelectorAll("[data-like]").forEach(b => b.onclick = () => toggleLike(b.dataset.like, b));
    root.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openCompose(posts.find(p => p.id === b.dataset.edit)));
    root.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "本当に削除？"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "削除"; }, 4000); return; }
      const p = posts.find(x => x.id === b.dataset.del); if (!p) return;
      try {
        const batch = writeBatch(db);
        batch.delete(doc(db, "groups", current.gid, "posts", p.id));
        if (isPublicSong(p)) batch.delete(doc(db, "songs", songId(current.gid, p.id)));
        await batch.commit();
      } catch (e) { console.error(e); b.textContent = "削除できませんでした"; }
    });
  }

  // いいね（同時に押されて数がずれたら、最新を読み直して1回だけやり直す）
  async function toggleLike(pid, btn) {
    btn.disabled = true;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const pref = doc(db, "groups", current.gid, "posts", pid);
        const fresh = attempt === 0 ? posts.find(p => p.id === pid) : { id: pid, ...(await getDoc(pref)).data() };
        if (!fresh) break;
        const on = !(fresh.likes && fresh.likes[me]);
        const next = { ...(fresh.likes || {}) }; if (on) next[me] = true; else delete next[me];
        const batch = writeBatch(db);
        batch.update(pref, { [`likes.${me}`]: on ? true : deleteField() });
        if (isPublicSong(fresh)) batch.update(doc(db, "songs", songId(current.gid, pid)), { likeCount: Object.keys(next).length });
        await batch.commit();
        break;
      } catch (e) { if (attempt === 1) console.error(e); }
    }
    btn.disabled = false;
  }

  // ===== 投稿フォーム =====
  let draft = null;
  function openCompose(post) {
    draft = post ? { ...post } : { category: "音楽", title: "", by: "", oneline: "", link: "", image: "", rating: 4, public: true };
    const c = $("compose");
    c.hidden = false;
    c.innerHTML = `
      <div class="actions">
        <button type="button" class="btn small" id="srcSong">🎵 曲を探す</button>
        <button type="button" class="btn small ghost" id="srcMine">DAILY FIND の記事から選ぶ</button>
      </div>
      <input id="mq" type="search" enterkeyhint="search" placeholder="曲名やアーティスト名を入れる" autocomplete="off">
      <div class="suggest" id="suggest" hidden></div>
      <div class="picked"><div id="pv"></div><div class="note">候補を選ぶと、タイトル・ジャケット・リンクが入ります。曲以外は下に直接書いてください。</div></div>
      <div class="row2">
        <label>カテゴリ<select id="fCat">${Object.keys(CATS).map(k => `<option ${k === draft.category ? "selected" : ""}>${k}</option>`).join("")}</select></label>
        <label>タイトル<input id="fTitle" maxlength="100" value="${esc(draft.title)}"></label>
      </div>
      <label>作者・アーティスト・場所など<input id="fBy" maxlength="100" value="${esc(draft.by)}"></label>
      <label>ひとこと（グループの人だけに見えます）<input id="fOne" maxlength="200" value="${esc(draft.oneline)}" placeholder="例：夕日を見ながら聴きたい曲"></label>
      <div class="lbl" role="group" aria-label="評価">評価<div class="rate" id="rate">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-label="星${n}">★</button>`).join("")}</div></div>
      <label>リンク（なくてもOK）<input id="fLink" type="url" maxlength="500" value="${esc(draft.link)}" placeholder="https://"></label>
      <label class="check" id="pubRow"><input type="checkbox" id="fPub" ${draft.public !== false ? "checked" : ""}><span>曲を「みんなのプレイリスト」にも載せる<br><span class="note">載るのは曲名・アーティスト・ジャケット・リンク・いいね数だけです。ニックネームやひとこと、グループ名は載りません。</span></span></label>
      <div class="actions"><button class="btn" id="post">${post ? "更新する" : "シェアする"}</button><button class="btn ghost" id="cancel" type="button">やめる</button><span class="msg" id="pMsg"></span></div>`;
    const drawRate = () => c.querySelectorAll("#rate button").forEach(b => b.classList.toggle("on", +b.dataset.n <= draft.rating));
    const drawPv = () => {
      $("pv").innerHTML = cover({ title: $("fTitle").value || "タイトル", category: $("fCat").value, image: draft.image });
      $("pubRow").hidden = $("fCat").value !== "音楽";
    };
    $("rate").onclick = e => { const b = e.target.closest("button[data-n]"); if (b) { draft.rating = +b.dataset.n; drawRate(); } };
    $("fTitle").oninput = drawPv; $("fCat").onchange = drawPv;
    drawRate(); drawPv();
    c.scrollIntoView({ behavior: "smooth", block: "start" });

    let seq = 0, timer = null, results = [];
    const sug = $("suggest");
    const showResults = (list, footer) => {
      results = list; sug.hidden = false;
      sug.innerHTML = list.length ? list.map((r, i) => `
        <div class="s-item" data-i="${i}">${r.thumb ? `<img src="${esc(r.thumb)}" alt="">` : cover(r)}
          <div><div class="s-t">${esc(r.title)}</div><div class="s-a">${esc(r.by || "")}</div></div></div>`).join("") + (footer ? `<div class="s-msg">${esc(footer)}</div>` : "")
        : `<div class="s-msg">見つかりませんでした。</div>`;
      sug.querySelectorAll(".s-item").forEach(el => el.onclick = () => {
        const r = results[+el.dataset.i];
        $("fTitle").value = r.title; $("fBy").value = r.by || ""; $("fCat").value = r.category || "音楽";
        if (r.link) $("fLink").value = r.link;
        if (r.oneline && !$("fOne").value) $("fOne").value = r.oneline;
        if (r.rating) { draft.rating = r.rating; drawRate(); }
        draft.image = r.image || ""; sug.hidden = true; $("mq").value = ""; drawPv();
      });
    };
    const runSearch = async () => {
      const q = $("mq").value.trim(); const my = ++seq;
      if (!q) { sug.hidden = true; return; }
      sug.hidden = false; sug.innerHTML = `<div class="s-msg">探しています…</div>`;
      try { const r = await searchSongs(q); if (my === seq) showResults(r); }
      catch { if (my === seq) sug.innerHTML = `<div class="s-msg">曲の検索につながりませんでした。</div>`; }
    };
    $("mq").addEventListener("input", e => { if (e.isComposing) return; clearTimeout(timer); timer = setTimeout(runSearch, 450); });
    $("mq").addEventListener("compositionend", () => { clearTimeout(timer); timer = setTimeout(runSearch, 300); });
    $("mq").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); runSearch(); } });
    $("srcSong").onclick = () => $("mq").focus();
    $("srcMine").onclick = async () => {
      try {
        const res = await fetch("../picks.json?v=" + Date.now(), { cache: "no-store" });
        const picks = (await res.json()).sort((a, b) => String(b.date).localeCompare(String(a.date)));
        const abs = img => /^images\/[\w.-]+$/.test(img || "") ? `https://dailyfind.github.io/${img}` : (/^https:\/\//.test(img || "") ? img : "");
        showResults(picks.map(p => ({ title: p.title, by: p.by, category: p.category, oneline: p.oneline, rating: p.rating,
          link: safeLink(p.link), image: abs(p.image), thumb: abs(p.image) })), "DAILY FIND の記事");
      } catch { showResults([], ""); }
    };

    $("cancel").onclick = () => { c.hidden = true; c.innerHTML = ""; };
    $("post").onclick = async () => {
      const data = {
        uid: me, nickname: current.nickname, icon: current.icon, color: current.color,
        category: $("fCat").value, title: $("fTitle").value.trim(), by: $("fBy").value.trim(),
        oneline: $("fOne").value.trim(), link: $("fLink").value.trim(),
        image: /^https:\/\//.test(draft.image || "") ? draft.image : "", rating: draft.rating | 0,
        public: $("fCat").value === "音楽" && $("fPub").checked,
      };
      if (!data.title) return setMsg("pMsg", "タイトルを入れてください。", false);
      if (data.link && !/^https:\/\//i.test(data.link)) return setMsg("pMsg", "リンクは https:// から始まるアドレスにしてください。", false);
      $("post").disabled = true; setMsg("pMsg", "シェアしています…", true);
      try {
        const batch = writeBatch(db);
        const pref = post ? doc(db, "groups", current.gid, "posts", post.id) : doc(collection(db, "groups", current.gid, "posts"));
        const sref = doc(db, "songs", songId(current.gid, pref.id));
        const song = { title: data.title, by: data.by, image: data.image, link: data.link };
        if (post) {
          // 編集：ニックネーム・アイコン・いいね・作成日はそのまま
          batch.set(pref, { ...data, nickname: post.nickname, icon: post.icon, color: post.color, likes: post.likes || {}, createdAt: post.createdAt, updatedAt: serverTimestamp() });
          const lc = Object.keys(post.likes || {}).length;
          if (isPublicSong(post) && data.public) batch.update(sref, { ...song, likeCount: lc });
          else if (isPublicSong(post) && !data.public) batch.delete(sref);
          else if (!isPublicSong(post) && data.public) batch.set(sref, { ...song, likeCount: lc, createdAt: serverTimestamp() });
        } else {
          batch.set(pref, { ...data, likes: {}, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
          if (data.public) batch.set(sref, { ...song, likeCount: 0, createdAt: serverTimestamp() });
        }
        await batch.commit();
        c.hidden = true; c.innerHTML = ""; tab = "feed";
      } catch (e) { console.error(e); setMsg("pMsg", "シェアできませんでした。少し待ってからもう一度押してください。", false); $("post").disabled = false; }
    };
  }

  // ===== みんなのプレイリスト（誰でも見られる。投稿した人やグループは分からない） =====
  let pubSort = "new";
  function publicScreen() {
    current = null; drawGroupSelect();
    screen.innerHTML = `
      <div class="pl-top">
        <div><h2>みんなのプレイリスト</h2><p>DAILY FIND FRIENDS でシェアされた曲。誰が投稿したかは表示されません。</p></div>
        <div class="seg"><button class="btn small" data-s="new">新しい順</button><button class="btn small ghost" data-s="top">いいね順</button></div>
      </div>
      <div class="tracklist" id="pubList"><p class="empty">読み込んでいます…</p></div>
      ${loadGroups().length ? "" : `<p style="margin-top:24px"><button class="btn ghost" id="toCreate">自分たちのグループを作る</button></p>`}`;
    if ($("toCreate")) $("toCreate").onclick = () => welcome(true);
    const listen = () => {
      stopListening();
      const q = pubSort === "top" ? query(collection(db, "songs"), orderBy("likeCount", "desc"), limit(100))
                                  : query(collection(db, "songs"), orderBy("createdAt", "desc"), limit(100));
      unsubs.push(onSnapshot(q, snap => {
        const list = []; snap.forEach(d => list.push(d.data()));
        $("pubList").innerHTML = list.length ? list.map((s, i) => `
          <div class="tr">
            <span class="no">${String(i + 1).padStart(2, "0")}</span>
            ${cover({ title: s.title, category: "音楽", image: s.image })}
            <div class="tt"><b>${esc(s.title)}</b><small>${esc(s.by || "")}</small></div>
            <div class="end">${s.likeCount ? `<span class="cnt">♥ ${s.likeCount | 0}</span>` : ""}${safeLink(s.link) ? `<a class="listen" href="${esc(safeLink(s.link))}" target="_blank" rel="noopener noreferrer">聴く ↗</a>` : ""}</div>
          </div>`).join("") : `<p class="empty">まだ曲がありません。</p>`;
      }, e => { console.error(e); $("pubList").innerHTML = `<p class="empty">読み込めませんでした。</p>`; }));
    };
    screen.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      pubSort = b.dataset.s;
      screen.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("ghost", x !== b));
      listen();
    });
    listen();
  }

  // ===== 曲の検索（外部のプログラムは隔離した枠でだけ動かす） =====
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const appleSearchUrl = (t, a) => "https://music.apple.com/jp/search?term=" + encodeURIComponent(`${t} ${a}`.trim());
  const s = v => (typeof v === "string" ? v : "");
  const https = u => (/^https:\/\//i.test(s(u)) ? s(u) : "");
  let frame = null, frameReady = null; const pending = new Map();
  function sandbox() {
    if (frameReady) return frameReady;
    frameReady = new Promise(ok => {
      frame = document.createElement("iframe"); frame.setAttribute("sandbox", "allow-scripts"); frame.hidden = true;
      frame.srcdoc = `<script>addEventListener("message", e => { const { id, url } = e.data || {};
        if (typeof url !== "string" || !/^https:\\/\\/api\\.deezer\\.com\\/search\\?/.test(url)) return;
        const cb = "cb" + String(id).replace(/\\W/g, ""); const sc = document.createElement("script");
        window[cb] = d => { parent.postMessage({ id, data: JSON.parse(JSON.stringify(d)) }, "*"); sc.remove(); };
        sc.onerror = () => parent.postMessage({ id, error: true }, "*"); sc.src = url + "&callback=" + cb; document.body.appendChild(sc); });<\/script>`;
      frame.onload = () => ok(frame); document.body.append(frame);
    });
    return frameReady;
  }
  addEventListener("message", e => {
    if (!frame || e.source !== frame.contentWindow) return;
    const p = pending.get(e.data && e.data.id); if (!p) return; pending.delete(e.data.id);
    e.data.error ? p.reject(new Error("net")) : p.resolve(e.data.data);
  });
  async function deezer(term) {
    const f = await sandbox(); const id = Date.now().toString(36) + Math.random().toString(36).slice(2);
    const data = await new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject }); setTimeout(() => { if (pending.delete(id)) reject(new Error("timeout")); }, 8000);
      f.contentWindow.postMessage({ id, url: "https://api.deezer.com/search?" + new URLSearchParams({ q: term, limit: 12, output: "jsonp" }) }, "*");
    });
    return (Array.isArray(data && data.data) ? data.data : []).map(t => ({
      title: s(t.title), by: s(t.artist && t.artist.name), category: "音楽",
      thumb: https(t.album && t.album.cover_medium), image: https(t.album && t.album.cover_xl),
      link: appleSearchUrl(s(t.title), s(t.artist && t.artist.name)),
    }));
  }
  async function apple(term) {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 5000);
    const res = await fetch("https://itunes.apple.com/search?" + new URLSearchParams({ term, country: "JP", media: "music", entity: "song", limit: 12, lang: "ja_jp" }), { signal: ctrl.signal });
    clearTimeout(t); if (!res.ok) throw new Error("apple");
    const d = await res.json();
    return (Array.isArray(d.results) ? d.results : []).map(x => ({
      title: s(x.trackName), by: s(x.artistName), category: "音楽",
      thumb: https(x.artworkUrl100), image: https(s(x.artworkUrl100).replace("100x100bb", "600x600bb")), link: https(x.trackViewUrl),
    }));
  }
  async function searchSongs(q) {
    if (!isIOS) { try { return await apple(q); } catch {} }
    return deezer(q);
  }
</script>
