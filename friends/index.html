<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DAILY FIND</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; base-uri 'none'">
<!-- グループ機能はメインページに移りました。招待リンク（#g=…&k=…）もそのまま引き継ぎます -->
<script>
  var h = location.hash.slice(1);
  var ok = /^(g=[A-Za-z0-9]+&k=[A-Za-z0-9]+|all|group)$/.test(h);
  location.replace("/" + (ok ? "#" + h : "#group"));
</script>
</head>
<body><p><a href="/#group">DAILY FIND を開く</a></p></body>
</html>
